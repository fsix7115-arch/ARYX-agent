[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aryx-agent"
version = "0.2.0"
description = "Zero-friction, self-healing, multi-provider terminal AI agent"
readme = "README.md"
authors = [{ name = "ARYx Open Source Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "sqlite-utils>=3.36.0",
]

[tool.setuptools.package-data]
aryx = ["gateway/templates/*.html", "web/static/*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
# Gateway channel extras (Section 16). Telegram (Bot API over httpx)
# and the Web UI (stdlib server) need NO extra install.
discord = [
    "discord.py>=2.0.0",
]
slack = [
    "slack-bolt>=1.0.0",
    "slack-sdk>=3.0.0",
]
# v2 extras (Sections 18-19). The scheduler (Section 20) is stdlib-only
# and needs no extra; custom providers (Section 17) need no extra either.
web = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",  # required by FastAPI for file uploads
]
browser = [
    "playwright>=1.40.0",
    "cryptography>=42.0.0",
]

[project.scripts]
aryx = "aryx.cli:run_cli"

[project.entry-points."pipx.run"]
aryx = "aryx.cli:run_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["aryx*"]
